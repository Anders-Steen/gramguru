name: release

# Release versioning: plain semver MAJOR.MINOR.PATCH in manifest.json; the git
# tag / GitHub Release is `v<core>`.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Package
        run: node scripts/package.js

      - name: Publish to the listed channel
        env:
          AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
          AMO_ADDON_ID: ${{ secrets.AMO_ADDON_ID }}
        run: |
          node scripts/publish.js --channel listed \
            --zip "web-ext-artifacts/gramguru-$(node -p "require('./manifest.json').version").zip"

      - name: Tag the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          core=$(node -p "require('./manifest.json').version")
          gh release view "v$core" >/dev/null 2>&1 || \
            gh release create "v$core" --title "v$core" --notes "Release $core" \
              "web-ext-artifacts/gramguru-$core.zip"
