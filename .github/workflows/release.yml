name: release

# Release versioning: plain semver MAJOR.MINOR.PATCH in manifest.json. Stable
# releases go to Mozilla (listed); no GitHub Release/tag is created here —
# GitHub Releases are used only for beta pre-releases.
on:
  push:
    branches: [main]
    paths: ["manifest.json"] # only when the version is bumped
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Package
        run: node scripts/package.js

      - name: Publish to the listed channel
        env:
          AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
          AMO_ADDON_ID: ${{ secrets.AMO_ADDON_ID }}
        run: |
          node scripts/publish.js --channel listed \
            --zip "web-ext-artifacts/gramguru-$(node -p "require('./manifest.json').version").zip"
