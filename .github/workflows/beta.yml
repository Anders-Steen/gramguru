name: beta

# Push a non-main branch -> build a beta and publish it to the unlisted/beta
# add-on.
#
# Versioning (hybrid, because AMO/MV3 forbids letters/hyphens in the manifest
# `version`, so a semver pre-release like `0.1.13-beta.3` can't go in it):
#   - semver identity:  git tag / release  v<core>-beta.<n>   (semver item 9)
#   - manifest version: <core>.<n>                            (MV3-legal, numeric)
# where <core> = manifest.json version (MAJOR.MINOR.PATCH) and <n> = run number.
#
# The rolling, prerelease Release tagged `beta` always hosts the signed XPI and
# updates.json under STABLE urls — that's what the add-on's update_url points at.
on:
  push:
    branches-ignore: [main]

permissions:
  contents: write

jobs:
  beta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Compute versions
        id: v
        run: |
          core=$(node -p "require('./manifest.json').version")
          n="${{ github.run_number }}"
          {
            echo "core=$core"
            echo "manifest=$core.$n"
            echo "tag=v$core-beta.$n"
          } >> "$GITHUB_OUTPUT"

      - name: Package beta
        env:
          BETA_VERSION: ${{ steps.v.outputs.manifest }}
        run: node scripts/package.js --beta

      - name: Publish to the beta (unlisted) channel
        env:
          AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
          AMO_ADDON_ID: ${{ secrets.BETA_ADDON_ID }}
          SIGN_WAIT: "120" # wait up to 10 min for signing
        run: |
          node scripts/publish.js --channel unlisted \
            --zip "web-ext-artifacts/gramguru-beta-${{ steps.v.outputs.manifest }}.zip"

      - name: Publish beta artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Rolling release: STABLE urls for the add-on's update_url/update_link.
          gh release view beta >/dev/null 2>&1 || \
            gh release create beta --prerelease --title "Beta channel" --notes "Rolling beta channel (stable update urls)."
          gh release upload beta updates.json web-ext-artifacts/gramguru-beta.xpi --clobber
          gh release edit beta --title "Beta ${{ steps.v.outputs.tag }}"

          # Per-build semver pre-release, for traceability. Signed XPI only;
          # GitHub attaches the source archives itself.
          gh release create "${{ steps.v.outputs.tag }}" \
            --prerelease \
            --title "${{ steps.v.outputs.tag }}" \
            --notes "Beta build ${{ steps.v.outputs.manifest }}" \
            web-ext-artifacts/gramguru-beta.xpi
