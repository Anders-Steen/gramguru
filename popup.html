<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GramGuru 🧐</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        padding: 14px 16px;
        min-width: 240px;
        background: #1b1b1b;
        color: #f2f2f2;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 10px;
      }
      h1 span {
        font-size: 18px;
      }
      label {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        font-size: 13px;
      }
      #status {
        font-size: 12px;
        color: #9ccc9c;
        margin: 8px 0;
        min-height: 1em;
      }
      small {
        display: block;
        font-size: 11px;
        color: #888;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <h1>GramGuru <span>🧐</span></h1>
    <label><input type="checkbox" id="enabled" /> Convert to grams</label>
    <p id="status"></p>
    <small>Metric only. No network calls. Data bundled from matprat.no. Firefox desktop &amp; Android.</small>
    <script type="module" src="src/popup.js"></script>
  </body>
</html>
